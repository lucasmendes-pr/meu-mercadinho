<!DOCTYPE html>
<html lang="pt-br">

<head>

</head>

<body class="tela-produtos">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-mercado">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">🛒 Meu Mercadinho</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Início</a></li>
                    <li class="nav-item" id="menuListaProdutos"><a class="nav-link" href="listaProduto.html">Produtos</a></li>
                    <li class="nav-item" id="menuCadastrarProduto"><a class="nav-link" href="cadastroProduto.html">Cadastrar Produto</a></li>
                    <li class="nav-item" id="menuCadastros"><a class="nav-link" href="listacadastro.html">Gerenciar Usuários</a></li>
                    <li class="nav-item" id="menuVendas"><a class="nav-link active" href="historicoVendas.html">Histórico de Vendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrinho.html">🛒 Carrinho</a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link" href="#" onclick="sair(); return false;">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <header class="topo-produtos">
            <div>
                <h1 id="tituloHistorico">Histórico</h1>
                <p>Acompanhe as vendas registradas no mercadinho.</p>
            </div>
        </header>

        <!-- RESUMO -->
        <section class="row g-3 mb-4" id="resumoVendas"></section>

        <!-- SOMENTE ADMINISTRADOR -->
        <section id="areaAdmin" style="display: none;">

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <label for="filtroCliente" class="form-label">Filtrar por cliente</label>
                    <select id="filtroCliente" class="form-select">
                        <option value="">Todos os clientes</option>
                    </select>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3 class="mb-3">🏆 Produtos mais vendidos</h3>
                    <div id="rankingProdutos"></div>
                </div>
            </div>

        </section>

        <!-- LISTA DE VENDAS -->
        <section>
            <h3 class="mb-3">Vendas</h3>
            <div id="listaVendas"></div>
            <p id="mensagemVendas" class="mensagem-vazia"></p>
        </section>

    </main>

    <script src="../JavaScript/permissoes.js"></script>
    <script src="../JavaScript/historicoVendas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
