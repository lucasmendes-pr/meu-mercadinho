<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Mercadinho</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../CSS/login.css">

</head>

<body class="tela-produtos">

    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-mercado">

        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand fw-bold" href="home.html">
                🛒 Meu Mercadinho
            </a>

            <!-- BOTÃO MENU CELULAR -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- LINKS DO MENU -->
            <div class="collapse navbar-collapse" id="menuNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link active" href="home.html">
                            Início
                        </a>
                    </li>

                    <li class="nav-item" id="menuListaProdutos">
                        <a class="nav-link" href="listaProduto.html">
                            Produtos
                        </a>
                    </li>

                    <!-- SOMENTE ADMINISTRADOR -->
                    <li class="nav-item" id="menuCadastrarProduto">
                        <a class="nav-link" href="cadastroProduto.html">
                            Cadastrar Produto
                        </a>
                    </li>

                    <!-- SOMENTE ADMINISTRADOR -->
                    <li class="nav-item" id="menuCadastros">
                        <a class="nav-link" href="listacadastro.html">
                            Gerenciar Usuários
                        </a>
                    </li>

                    <!-- SOMENTE ADMINISTRADOR -->
                    <li class="nav-item" id="menuVendas">
                        <a class="nav-link" href="historicoVendas.html">
                            Histórico de Vendas
                        </a>
                    </li>

                    <!-- TODOS OS USUÁRIOS -->
                    <li class="nav-item">
                        <a class="nav-link" href="carrinho.html">
                            🛒 Carrinho
                        </a>
                    </li>

                    <!-- SAIR -->
                    <li class="nav-item ms-lg-2">
                        <a class="nav-link" href="#" onclick="sair(); return false;">
                            Sair
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container py-5">

        <!-- APRESENTAÇÃO -->
        <section class="mb-5">

            <h1>Bem-vindo ao Meu Mercadinho! 🛒</h1>

            <p>
                Confira nossos produtos e encontre o que você precisa.
            </p>

        </section>


        <!-- PESQUISA DE PRODUTOS -->
        <section class="mb-4">

            <label for="pesquisaProduto" class="form-label">
                Pesquisar produtos
            </label>

            <input type="text" id="pesquisaProduto" class="form-control" placeholder="Digite o nome do produto...">

        </section>


        <!-- VITRINE DE PRODUTOS -->
        <section>

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Nossos Produtos</h2>

                <span id="totalProdutos" class="badge text-bg-success">
                    0 produtos
                </span>

            </div>

            <!-- PRODUTOS CARREGADOS PELO JAVASCRIPT -->
            <div id="dadosProdutos" class="row g-4">

            </div>

            <!-- MENSAGEM -->
            <p id="mensagemProdutos" class="text-center mt-4"></p>

        </section>

    </main>


    <!-- CONTROLE DE PERMISSÕES -->
    <script src="../JavaScript/permissoes.js"></script>

    <!-- JAVASCRIPT DO PROJETO -->
    <script src="../JavaScript/home.js"></script>

    <!-- BOOTSTRAP JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
