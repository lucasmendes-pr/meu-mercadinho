<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Meu Mercadinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body class="tela-produtos">

    <nav class="navbar navbar-expand-lg navbar-dark navbar-mercado">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">🛒 Meu Mercadinho</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar"
                aria-controls="menuNavbar" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Início</a></li>
                    <li class="nav-item" id="menuListaProdutos"><a class="nav-link" href="listaProduto.html">Produtos</a></li>
                    <li class="nav-item" id="menuCadastrarProduto"><a class="nav-link" href="cadastroProduto.html">Cadastrar Produto</a></li>
                    <li class="nav-item" id="menuCadastros"><a class="nav-link" href="listacadastro.html">Gerenciar Usuários</a></li>
                    <li class="nav-item" id="menuVendas"><a class="nav-link " href="historicoVendas.html">Histórico de Vendas</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrinho.html">🛒 Carrinho</a></li>
                    <li class="nav-item ms-lg-2"><a class="nav-link" href="#" onclick="sair(); return false;">Sair</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="caixa-cad">

            <div class="topo-login">
                <h1 id="tituloPerfil">Meu Perfil</h1>
                <p>Atualize seus dados. O CPF não pode ser alterado.</p>
            </div>

            <div class="corpo-login">

                <form id="formPerfil" onsubmit="return false;">

                    <div class="grupo-campo">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" placeholder="Nome completo">
                    </div>

                    <div class="grupo-campo">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" readonly>
                    </div>

                    <div class="grupo-campo">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" maxlength="8" placeholder="Digite o CEP (apenas números)"
                            onchange="buscarEndereco()">
                    </div>

                    <div class="grupo-campo">
                        <label for="endereco">Endereço (Rua):</label>
                        <input type="text" id="endereco" placeholder="Preenchido pelo CEP" readonly>
                    </div>

                    <div class="grupo-campo">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" placeholder="Preenchido pelo CEP" readonly>
                    </div>

                    <div class="grupo-campo">
                        <label for="numero">Número / Complemento:</label>
                        <input type="text" id="numero" placeholder="Nº da casa ou apto">
                    </div>

                    <div class="grupo-campo">
                        <label for="telefone">Telefone:</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <hr>

                    <h5 class="mb-3">Alterar senha (opcional)</h5>

                    <div class="grupo-campo" id="grupoSenhaAtual">
                        <label for="senhaAtual">Senha atual:</label>
                        <input type="password" id="senhaAtual" placeholder="Obrigatória para trocar a senha">
                    </div>

                    <div class="grupo-campo">
                        <label for="senhaNova">Nova senha:</label>
                        <input type="password" id="senhaNova" placeholder="Deixe em branco para manter a atual">
                    </div>

                    <div class="botoes-acoes">
                        <button type="button" class="botao-logar" onclick="salvarPerfil()">Salvar alterações</button>
                        <a href="home.html" id="linkVoltar" class="botao-voltar">Voltar</a>
                    </div>

                </form>

            </div>

        </div>

    </main>

    <script src="../JavaScript/permissoes.js"></script>
    <script src="../JavaScript/apicep.js"></script>
    <script src="../JavaScript/perfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
