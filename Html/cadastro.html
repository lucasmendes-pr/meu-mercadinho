
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Mercadinho - Cadastro</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS do projeto -->
    <link href="/css/login.css" rel="stylesheet">

</head>

<body class="tela-login">

    <div class="caixa-cad">

        <div class="topo-login">

            <img src="" alt="">

            <h1>Mercadinho</h1>

            <p>Preencha os dados de cadastro</p>

        </div>

        <div class="corpo-login">

            <form id="cadasform">

                <div class="grupo-campo">

                    <label for="nome">Nome:</label>

                    <input type="text" name="nome" id="nome"
                        placeholder="Digite seu nome completo">

                </div>

                <div class="grupo-campo">

                    <label for="cep">CEP:</label>

                    <input type="text" id="cep" maxlength="8"
                        placeholder="Digite o CEP (apenas números)"
                        onblur="buscarEndereco()">

                </div>

                <div class="grupo-campo">

                    <label for="endereco">Endereço (Rua):</label>

                    <input type="text" name="endereco" id="endereco"
                        placeholder="Preenchido pelo CEP" readonly>

                </div>

                <div class="grupo-campo">

                    <label for="bairro">Bairro:</label>

                    <input type="text" id="bairro"
                        placeholder="Preenchido pelo CEP" readonly>

                </div>

                <div class="grupo-campo">

                    <label for="numero">Número / Complemento:</label>

                    <input type="text" id="numero"
                        placeholder="Nº da casa ou apto">

                </div>

                <div class="grupo-campo">

                    <label for="telefone">Telefone:</label>

                    <input type="text" name="telefone" id="telefone"
                        placeholder="(00) 00000-0000">

                </div>

                <div class="grupo-campo">

                    <label for="cpf">CPF:</label>

                    <input type="text" name="cpf" id="cpf"
                        placeholder="000.000.000-00">

                </div>

                <div class="grupo-campo">

                    <label for="senha">Senha:</label>

                    <input type="password" name="senha" id="senha"
                        placeholder="Digite sua senha">

                </div>

                <!-- BOTÃO CADASTRAR -->

                <button type="button" onclick="salvar()" class="botao-logar">
                    Cadastrar Usuário
                </button>

                <!-- BOTÃO VOLTAR PARA LOGIN -->

                <div class="rodape-links">

                    <a href="login.html">
                        Voltar para Login
                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- API ViaCEP -->

    <script src="../javaScript/apicep.js"></script>

    <!-- JavaScript do cadastro -->

    <script src="/javaScript/cadastrar.js"></script>

</body>

</html>
