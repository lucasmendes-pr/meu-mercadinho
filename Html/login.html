<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>pagina de Login </title>
    
    <!-- Link do Bootstrap para cuidar da tipografia e fontes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Link para o seu arquivo de estilização externa -->
    <link href="/css/login.css" rel="stylesheet">
</head>
<body class="tela-login">

    <div class="caixa-login">
        <div class="topo-login">
            <h1>Login</h1>
        </div>

        <div class="corpo-login">
            <form onsubmit="validarLogin(event)">
                <!-- Mantidos os labels e os inputs exatamente como você estruturou -->
                <div class="grupo-campo">
                    <label for="cpf">CPF:</label>
                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00">
                </div>
                
                <div class="grupo-campo">
                    <label for="pass">Senha:</label>
                    <!-- Alterado para type="password" apenas por segurança visual ao digitar -->
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
                </div>
                
                <button type="submit" class="botao-logar">Logar Usuario</button>
                
                <div class="rodape-links">
                    <a href="cadastro.html">Cadastrar Usuario</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/javaScript/validarLogin.js"></script>
</body>
</html>
