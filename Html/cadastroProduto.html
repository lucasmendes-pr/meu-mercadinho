<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="/css/login.css" rel="stylesheet">
</head>

<body class="tela-login">

    

    <div class="caixa-login">

        <div class="topo-login">
            <h1>Cadastro de Produto</h1>
        </div>

        <div class="corpo-login">

            <form id="cadasform">

                <div class="grupo-campo">

                    <label for="imgProduto">Foto do produto:</label>

                    <input type="file" id="imgProduto" accept="image/*">

                    <img id="previewImagem" alt="Pré-visualização do produto"
                        style="display: none; width: 150px; height: 150px; object-fit: cover; margin-top: 10px;">

                </div>

                <div class="grupo-campo">

                    <label for="descricao">Descrição:</label>

                    <input type="text" id="descricao" placeholder="Descrição do Produto">

                </div>
                 <div class="grupo-campo">

                    <label for="quantidade">Quantridade:</label>

                    <input type="number" id="quantidade" placeholder="Quantidade">

                </div>

                <div class="grupo-campo">

                    <label for="preco">Preço:</label>

                    <input type="number" id="preco" placeholder="R$ 00,00" step="0.01" min="0">

                </div>

                <div class="botoes-acoes">

                    <button type="button" onclick="salvar();" class="botao-logar">
                        Cadastrar Produto
                    </button>

                    <a href="/Html/listaProduto.html" class="botao-voltar">
                        Voltar para Lista
                    </a>

                </div>

            </form>

        </div>

    </div>

    <script src="/javaScript/produtocadastro.js"></script>

</body>

</html>
